name: Gatehouse release validation
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'fix/post-payment-complaint-recovery' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - name: Run regression tests and verify production build
        run: |
          npm test -- --maxWorkers=3
          npx tsc -p tsconfig.app.json --noEmit
          npx tsc -p tsconfig.node.json --noEmit
          npm run build
          npm run check:html
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser checks against the built site
        run: |
          cat > "$RUNNER_TEMP/gatehouse-playwright.cjs" <<'CONFIG'
          module.exports = {
            testDir: process.env.GITHUB_WORKSPACE,
            testMatch: ["e2e/*.spec.ts", "tests/cabinet-mobile.spec.ts"],
            outputDir: process.env.RUNNER_TEMP + "/gatehouse-browser-results",
            workers: 2,
            timeout: 45000,
            use: { baseURL: "http://127.0.0.1:8080" },
            webServer: {
              command: "npm run preview -- --host 127.0.0.1 --port 8080 --strictPort",
              cwd: process.env.GITHUB_WORKSPACE,
              url: "http://127.0.0.1:8080",
              reuseExistingServer: false
            }
          };
          CONFIG
          npx playwright test -c "$RUNNER_TEMP/gatehouse-playwright.cjs" --browser=chromium
          npx playwright test -c "$RUNNER_TEMP/gatehouse-playwright.cjs" --browser=webkit -g 'mobile quote is submitted'
